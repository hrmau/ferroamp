[package]
name = "ferroamp"
version = "0.1.0"
edition = "2024"
description = "A small, fast music player for macOS in the spirit of the classic desktop players"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hrmau/ferroamp"
readme = "README.md"
keywords = ["music", "audio", "player", "macos", "gapless"]
categories = ["multimedia::audio"]

[dependencies]
block2 = "0.6.2"
cpal = "0.18.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSAlert", "NSApplication", "NSCell", "NSControl", "NSEvent", "NSMenu", "NSMenuItem", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSScrollView", "NSText", "NSTextField", "NSTextView", "NSView", "NSWindow"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFAttributedString", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSGeometry", "NSString", "NSURL", "NSValue"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "CALayer", "CATransaction"] }
objc2-media-player = { version = "0.3.2", default-features = false, features = ["std", "block2", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }
realfft = "3.5.1"
rfd = "0.17.2"
rtrb = "0.4.1"
rubato = "5.0.1"
symphonia = { version = "0.6.1", features = ["all"] }
winit = "0.30"
native-tls = "0.2"
miniz_oxide = "0.8"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "alloc"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-graphics", "CTFont", "CTLine", "CTStringAttributes"] }

[dev-dependencies]
png = "0.18.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
